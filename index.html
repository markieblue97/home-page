<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A collection of web projects by Mark Imbing." />
    <title>Mark Imbing — Web Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="top">
      <section class="projects" aria-labelledby="projects-heading">
        <header class="section-header">
          <p class="eyebrow">01—02 / Featured work</p>
          <h2 id="projects-heading">Things I’ve<br />put on the internet.</h2>
        </header>

        <div class="project-list" aria-label="Project links">
          <a class="project-button clue-button" href="https://clue-detective-sheet.vercel.app/" target="_blank" rel="noopener noreferrer">
            <img src="assets/clue-detective-art.png" alt="Detective notebook, magnifying glass, and clue board" />
            <span class="button-number">01</span>
            <span class="button-caption"><span>Clue Detective Sheet</span><b aria-hidden="true">↗</b></span>
          </a>
          <a class="project-button smash-button" href="https://smash-ultimate-notebook.vercel.app/#top" target="_blank" rel="noopener noreferrer">
            <img src="assets/smash-notebook-art.png" alt="Colorful gaming notebook with abstract controller shapes" />
            <span class="button-number">02</span>
            <span class="button-caption"><span>Smash Ultimate Notebook</span><b aria-hidden="true">↗</b></span>
          </a>
          <a class="project-button candle-button" href="https://candle-game-beige.vercel.app/" target="_blank" rel="noopener noreferrer">
            <img src="assets/candle-game-art.png" alt="Celebration cake topped with many glowing candles" />
            <span class="button-number">03</span>
            <span class="button-caption"><span>Candle Game</span><b aria-hidden="true">↗</b></span>
          </a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Vibe coded by Mark Imbing.</p>
      <a href="#top">Back to top ↑</a>
      <div class="kofi-wrap" aria-label="Support me on Ko-fi"></div>
    </footer>

    <script type="text/javascript" src="https://storage.ko-fi.com/cdn/widget/Widget_2.js"></script>
    <script type="text/javascript">kofiwidget2.init('Support me on Ko-fi', '#146aff', 'I0T025K0XF');kofiwidget2.draw();</script>
    <script src="script.js"></script>
  </body>
</html>
